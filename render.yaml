services:
  - type: web
    name: enclave-relay
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      - key: STUN_URL
        value: "stun:stun.l.google.com:19302"
      - key: TURN_URL
        value: ""
      - key: TURN_USERNAME
        value: ""
      - key: TURN_CREDENTIAL
        value: ""
      - key: ENVELOPE_TTL_HOURS
        value: "168"
